# ==================== JWT 配置 ====================
jwt:
  secret: YWdlbnRkZXNrLWludGVsbGlnZW50LXdvcmstb3JkZXItc3lzdGVtLXNlY3JldC1rZXktMjAyNg==
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# ==================== MyBatis-Plus 通用配置 ====================
mybatis-plus:
  mapper-locations: classpath*:com/agentdesk/**/mapper/**/*Mapper.xml
  type-aliases-package: com.agentdesk.**.domain
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== RabbitMQ 通用配置 ====================
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  # 数据源通用配置（不包含 url、username、password）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 10
      minimum-idle: 5

  # AI 配置
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-5df2d90f6ac24a99a5b64a0ccb256839}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7
          max-tokens: 4096

# LLM 配置
llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-5df2d90f6ac24a99a5b64a0ccb256839}
    base-url: https://api.deepseek.com
    model: deepseek-v4-pro
    max-tokens: 4096
    temperature: 0.7
    timeout: 60000