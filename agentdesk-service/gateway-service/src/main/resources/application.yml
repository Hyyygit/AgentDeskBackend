server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:agentdesk}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:agentdesk}
        file-extension: yml
        shared-configs:
          - data-id: agentdesk-common.yml
            group: DEFAULT_GROUP
            refresh: true

    gateway:
      server:
        webflux:
          routes:
            # Auth/User Service
            - id: user-service
              uri: http://localhost:9001
              predicates:
                - Path=/api/user/**
            # Conversation Service
            - id: conversation-service
              uri: http://localhost:9002
              predicates:
                - Path=/api/conversations/**
            # Ticket Service
            - id: ticket-service
              uri: http://localhost:9000
              predicates:
                - Path=/api/tickets/**
            # Knowledge Service
            - id: knowledge-service
              uri: http://localhost:9003
              predicates:
                - Path=/api/knowledge/**
            # Orchestrator Service
            - id: orchestrator-service
              uri: http://localhost:9005
              predicates:
                - Path=/api/orchestrator/**
            # Audit Service
            - id: audit-log-service
              uri: http://localhost:9004
              predicates:
                - Path=/api/audit/**,/api/log/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: false

jwt:
  secret: YWdlbnRkZXNrLWludGVsbGlnZW50LXdvcmstb3JkZXItc3lzdGVtLXNlY3JldC1rZXktMjAyNg==
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

app:
  security:
    exclude-paths:
      - /api/user/login
      - /api/user/register
      - /api/user/refresh
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-resources/**
