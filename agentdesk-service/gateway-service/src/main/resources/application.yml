server:
  port: 8080

spring:
  application:
    name: gateway-service

  config:
    import:
      - optional:nacos:agentdesk-common.yml?group=DEFAULT_GROUP&refreshEnabled=true

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:18848}
      config:
        namespace: ${NACOS_NAMESPACE:72c65630-17c3-4239-b14d-dd92d3705774}
      discovery:
        namespace: ${NACOS_NAMESPACE:72c65630-17c3-4239-b14d-dd92d3705774}

    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Auth/User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
        
        # Conversation Service
        - id: conversation-service
          uri: lb://conversation-service
          predicates:
            - Path=/api/conversations/**
          filters:
            - StripPrefix=0
        
        # Ticket Service
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/tickets/**
          filters:
            - StripPrefix=0
        
        # Knowledge Service
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=0
        
        # Orchestrator Service
        - id: orchestrator-service
          uri: lb://agent-orchestrator-service
          predicates:
            - Path=/api/orchestrator/**
          filters:
            - StripPrefix=0
        
        # Audit Service
        - id: audit-log-service
          uri: lb://audit-log-service
          predicates:
            - Path=/api/audit/**,/api/log/**
          filters:
            - StripPrefix=0
        
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false

app:
  security:
    exclude-paths:
      - /api/user/login
      - /api/user/register
      - /api/user/refresh
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-resources/**
