server:
  port: 9005

spring:
  application:
    name: agent-orchestrator-service
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/agentdesk-log?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: OrchestratorHikariPool

mybatis-plus:
  mapper-locations: classpath*:com/agentdesk/orchestrator/mapper/**/*Mapper.xml
  type-aliases-package: com.agentdesk.orchestrator.domain
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: YWdlbnRkZXNrLWludGVsbGlnZW50LXdvcmstb3JkZXItc3lzdGVtLXNlY3JldC1rZXktMjAyNg==
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    max-tokens: 4096
    temperature: 0.7
    timeout: 60000
